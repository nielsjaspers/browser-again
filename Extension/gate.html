<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163b3b">
  <title>Take a moment · Browser Again</title>
  <link rel="stylesheet" href="gate.css">
  <script type="module" src="gate.js"></script>
</head>
<body data-phase="loading">
  <div class="breath-field" aria-hidden="true"></div>
  <main>
    <p id="site" class="site">Browser Again</p>
    <div class="message">
      <p id="eyebrow" class="eyebrow">Take a moment</p>
      <h1 id="heading" aria-live="polite" aria-atomic="true">Take a deep breath.</h1>
      <p id="detail" role="status" aria-live="polite">Checking your session…</p>
    </div>
    <div class="actions">
      <button id="close" type="button" disabled>Close this tab</button>
      <button id="continue" class="continue" type="button" hidden>Continue</button>
      <button id="emergency" class="emergency" type="button" hidden>Emergency · 5 more minutes</button>
      <button id="retry" class="continue" type="button" hidden>Try again</button>
      <p id="error" role="alert"></p>
    </div>
  </main>
</body>
</html>
