<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube · Browser Again</title>
  <link rel="stylesheet" href="blocked.css">
  <script type="module" src="youtube.js"></script>
</head>
<body><main>
  <p class="label">Browser Again · YouTube</p>
  <h1>Are you sure?</h1>
  <p id="status" role="status" aria-live="polite">You can open YouTube for 5 minutes.</p>
  <div class="actions">
    <button id="confirm" type="button" disabled>Yes, open YouTube</button>
    <button id="emergency" class="secondary" type="button" disabled>Emergency</button>
  </div>
  <p class="note">Emergency skips the wait. The 5-minute limit still applies.</p>
</main></body>
</html>
