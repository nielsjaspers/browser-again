<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sites · Browser Again</title>
  <link rel="stylesheet" href="blocked.css">
  <link rel="stylesheet" href="sites.css">
  <script type="module" src="sites.js"></script>
</head>
<body><main>
  <h1>Blocked sites</h1>
  <section aria-labelledby="custom-heading">
    <h2 id="custom-heading">Your sites</h2>
    <form id="add-site">
      <label for="site">Domain or website URL</label>
      <div class="add-row"><input id="site" name="site" type="text" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="reddit.com" required><button type="submit" id="add" disabled>Add</button></div>
    </form>
    <p class="note">Includes subdomains. Saved on this device.</p>
    <p id="status" role="status" aria-live="polite">Loading…</p>
    <ul id="custom-sites" aria-label="Custom blocked sites"></ul>
  </section>
  <section aria-labelledby="built-in-heading">
    <h2 id="built-in-heading">Built-in sites</h2>
    <ul class="built-in"><li>YouTube <span>5-minute passes</span></li><li>Hacker News</li><li>X / Twitter and Nitter</li></ul>
  </section>
</main></body>
</html>
