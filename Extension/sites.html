<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sites · Browser Again</title>
  <link rel="stylesheet" href="blocked.css"><link rel="stylesheet" href="sites.css">
  <script type="module" src="sites.js"></script>
</head>
<body><main>
  <h1>Block a site</h1>
  <section aria-labelledby="custom-heading">
    <form id="add-site">
      <label for="site">Domain or website URL</label>
      <input id="site" name="site" type="text" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="linkedin.com" required>
      <label class="check"><input id="subdomains" type="checkbox" checked> Include all subdomains</label>
      <label for="mode">Access</label>
      <select id="mode"><option value="block">Always blocked</option><option value="timed">Breathe, then 5 minutes</option></select>
      <button type="submit" id="add" disabled>Block site</button>
    </form>
    <p id="status" role="status" aria-live="polite">Loading…</p>
    <h2 id="custom-heading">Your sites</h2>
    <ul id="custom-sites" aria-label="Custom blocked sites"></ul>
  </section>
  <section aria-labelledby="built-in-heading">
    <h2 id="built-in-heading">Built-in sites</h2>
    <ul class="built-in"><li>YouTube <span>Breathe, then 5 minutes</span></li><li>Hacker News</li><li>X / Twitter and Nitter</li></ul>
  </section>
</main></body>
</html>
